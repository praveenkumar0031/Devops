<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | System Drift</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #000;
            color: #fff;
            font-family: 'Inter', -apple-system, sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
            /* Creates a soft focus effect on the edges */
            mask-image: radial-gradient(circle, black 30%, transparent 90%);
        }

        .ui-layer {
            position: relative;
            z-index: 10;
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 50px;
            border-radius: 24px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: clamp(6rem, 20vw, 12rem);
            margin: 0;
            font-weight: 900;
            letter-spacing: -8px;
            background: linear-gradient(to bottom, #ffffff 40%, #333 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #666;
            font-size: 1rem;
            margin-top: -10px;
            margin-bottom: 35px;
            letter-spacing: 4px;
            font-weight: 500;
            text-transform: uppercase;
        }

        .home-btn {
            padding: 14px 40px;
            border: 1px solid rgba(255,255,255,0.8);
            background: transparent;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-block;
        }

        .home-btn:hover {
            background: #fff;
            color: #000;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div class="ui-layer">
        <h1>404</h1>
        <p>Resource Fragmented</p>
        <a href="index.html" class="home-btn">Initialize Recovery</a>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        // The specific character set you requested
        const charSet = "!@#$%^&*(){}+_:\"';/.?<>,.~".split("");
        let particles = [];

        function init() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            particles = [];
            // Dense population for the background effect
            for (let i = 0; i < 150; i++) {
                particles.push(new Particle());
            }
        }

        class Particle {
            constructor() {
                this.reset();
                this.y = Math.random() * height; // Start at random heights initially
            }

            reset() {
                this.x = Math.random() * width;
                this.y = -20;
                this.speed = Math.random() * 2 + 0.5;
                this.char = charSet[Math.floor(Math.random() * charSet.length)];
                this.fontSize = Math.random() * 16 + 10;
                // Layering opacity for depth
                this.opacity = Math.random() * 0.45 + 0.05;
            }

            update() {
                this.y += this.speed;
                if (this.y > height) this.reset();
            }

            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.font = `${this.fontSize}px 'Courier New', monospace`;
                ctx.fillText(this.char, this.x, this.y);
            }
        }

        function animate() {
            // Subtle trail effect
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(0, 0, width, height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', init);

        init();
        animate();
    </script>
</body>
</html>
